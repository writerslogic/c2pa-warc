[package]
name = "c2pa-warc"
version = "0.2.0"
edition = "2021"
# One MSRV across the crate family; verified with `cargo +1.87 check`.
rust-version = "1.87"
description = "C2PA manifest embedding for WARC web archive files (ISO 28500)"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/writerslogic/c2pa-warc"
keywords = ["c2pa", "provenance", "warc", "web-archive"]
categories = ["encoding", "parser-implementations"]

[dependencies]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Python bindings, built with maturin/PyO3 for the PyPI distribution. Native
# builds without it stay dependency-free.
python = ["dep:pyo3"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pyo3 = { version = "0.25", optional = true, features = ["extension-module", "abi3-py39"] }

# The npm distribution is a `wasm32` build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
