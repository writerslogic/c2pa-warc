[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "c2pa-warc"
description = "C2PA Manifest Store embedding and reading for WARC web archives (ISO 28500)"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.9"
keywords = ["c2pa", "provenance", "warc", "web-archive", "iso28500"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/writerslogic/c2pa-warc"

[tool.maturin]
features = ["python"]
module-name = "c2pa_warc"
